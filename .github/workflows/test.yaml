name: CI
on: [push, pull_request]
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
        - '1.23'
        - '1.24'
        - '1.25'
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    - name: go test
      run: go test -race -v ./...
